name: Release

# Publish to npm with provenance on every version tag (v0.1.0, v0.2.0, …).
# Required since May 2026 for n8n verified community nodes. Needs an npm
# granular automation token in the repo secret NPM_TOKEN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance (Sigstore attestation via GitHub OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
